name: geometry

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  native-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Switch to full explicitly for a later complete acceptance run.
    env:
      CHECK_SCOPE: docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - name: Install fixed MoonBit toolchain
        if: env.CHECK_SCOPE != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          version='0.10.13%2Bcbb11c36f'
          export MOON_HOME="$RUNNER_TEMP/moonclip-moon"
          mkdir -p "$MOON_HOME/lib"
          curl --fail --location --retry 3 \
            "https://cli.moonbitlang.com/binaries/$version/moonbit-linux-x86_64.tar.gz" \
            --output "$RUNNER_TEMP/moonbit.tar.gz"
          curl --fail --location --retry 3 \
            "https://cli.moonbitlang.com/cores/core-$version.tar.gz" \
            --output "$RUNNER_TEMP/core.tar.gz"
          echo "ef643f267d5ee075dbafd54b44b0a26c55116340515dca07294c2a0b83479a8b  $RUNNER_TEMP/moonbit.tar.gz" | sha256sum --check
          echo "d36b64c42df3019d9da87291e40738e90623c0380d0e200a62156091fb00c176  $RUNNER_TEMP/core.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/moonbit.tar.gz" -C "$MOON_HOME"
          tar -xzf "$RUNNER_TEMP/core.tar.gz" -C "$MOON_HOME/lib"
          chmod +x "$MOON_HOME"/bin/* "$MOON_HOME/bin/internal/tcc"
          export PATH="$MOON_HOME/bin:$PATH"
          moon -C "$MOON_HOME/lib/core" bundle --target native --warn-list -a
          moon -C "$MOON_HOME/lib/core" bundle --target js --warn-list -a
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Check selected scope
        run: |
          set -euo pipefail
          if [[ "$CHECK_SCOPE" == package ]]; then
            mkdir -p _build/release-0.4.0
            bash scripts/check.sh --scope "$CHECK_SCOPE" 2>&1 | tee _build/release-0.4.0/check.log
          elif [[ "$CHECK_SCOPE" == full ]]; then
            mkdir -p _build/full-acceptance
            bash scripts/check.sh --scope "$CHECK_SCOPE" 2>&1 | tee _build/full-acceptance/full.log
          else
            bash scripts/check.sh --scope "$CHECK_SCOPE"
          fi
      - name: Check local documentation targets
        if: env.CHECK_SCOPE == 'full'
        run: |
          set -euo pipefail
          python scripts/check_docs.py 2>&1 | tee _build/full-acceptance/docs.log
      - name: Build static MoonBit demo
        if: env.CHECK_SCOPE == 'full'
        working-directory: demo
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../_build/full-acceptance/demo-build.log
      - name: Smoke test the real JS geometry bridge
        if: env.CHECK_SCOPE == 'full'
        working-directory: demo
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../_build/full-acceptance/demo-tests.log
      - name: Check bounded benchmark runner (no performance threshold)
        if: env.CHECK_SCOPE == 'full'
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p test_bench.py 2>&1 | tee _build/full-acceptance/bench-tools.log
          bash scripts/bench.sh --target native --smoke --report _build/full-acceptance/bench-smoke.json 2>&1 | tee _build/full-acceptance/bench.log
      - name: Audit source snapshot and external native/JS consumers
        if: env.CHECK_SCOPE == 'full'
        run: |
          set -euo pipefail
          python scripts/check_release.py --report _build/full-acceptance/package/report.json --publication-status unpublished-source-test-snapshot 2>&1 | tee _build/full-acceptance/package.log
      - name: Save full acceptance evidence
        if: always() && env.CHECK_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-acceptance-linux
          path: |
            _build/full-acceptance/
            _build/conformance/
          if-no-files-found: error
      - name: Save 0.4.0 release candidate and external consumer evidence
        if: always() && env.CHECK_SCOPE == 'package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-0.4.0-linux
          path: _build/release-0.4.0/
          if-no-files-found: error

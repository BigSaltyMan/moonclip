name: rebuild-reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - name: Show compiler and build environment
        run: |
          python --version
          cmake --version
          c++ --version
          ninja --version
      - name: Build verified fixed upstream
        run: bash scripts/build_oracle.sh
      - name: Run real adapter integration tests
        run: python tools/oracle/test_adapter.py
      - name: Rebuild and compare all reference results
        run: bash scripts/generate_reference.sh --manifest testdata/manifest.json --check
      - name: Check offline catalog
        run: python scripts/check_reference.py --manifest testdata/manifest.json --strict
      - name: Rebuild and compare all offset reference results
        run: bash scripts/generate_reference.sh --manifest testdata/offset-manifest.json --check
      - name: Check offline offset catalog
        run: python scripts/check_reference.py --manifest testdata/offset-manifest.json --strict
